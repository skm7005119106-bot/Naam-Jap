<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Naam Jap — Naam Smaran, a peaceful offline-first japa counting app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=3.1.0">
  <title>Naam Jap — Naam Smaran</title>
</head>
<body>
  <div id="app" class="app-shell">
    <section id="splash" class="splash-screen" aria-label="Naam Jap">
      <div class="brand-mark" aria-hidden="true">ॐ</div>
      <h1>Naam Jap</h1><p>Naam Smaran</p>
    </section>

    <section id="onboarding" class="screen onboarding-screen hidden">
      <div class="onboarding-card">
        <div class="brand-mark small" aria-hidden="true">ॐ</div>
        <h1 data-i18n="appName">Naam Jap</h1>
        <p class="muted" data-i18n="intro">A peaceful space for remembering the Divine Name, one Jap at a time.</p>
        <div class="field-group">
          <label data-i18n="language">Language</label>
          <div class="choice-grid two">
            <button class="choice-btn" data-lang="hi">हिन्दी</button>
            <button class="choice-btn" data-lang="en">English</button>
          </div>
        </div>
        <div class="field-group">
          <label for="onboarding-naam" data-i18n="preferredNaam">Preferred Jap Naam</label>
          <select id="onboarding-naam"></select>
        </div>
        <div class="field-group">
          <label for="onboarding-custom" data-i18n="customNaamOptional">Custom Naam (optional)</label>
          <input id="onboarding-custom" maxlength="80" autocomplete="off" placeholder="Enter a Naam">
        </div>
        <button id="onboarding-continue" class="primary-btn full" data-i18n="continue">Continue</button>
      </div>
    </section>

    <main id="main" class="main hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow" data-i18n="appName">Naam Jap</div>
          <div id="topbar-title" class="topbar-title">Home</div>
        </div>
        <button id="topbar-action" class="icon-btn" aria-label="Notifications" title="Notifications">◌</button>
      </header>

      <section id="view-home" class="view active"></section>
      <section id="view-jap" class="view"></section>
      <section id="view-naam" class="view"></section>
      <section id="view-profile" class="view"></section>
      <section id="view-sankalp" class="view"></section>
      <section id="view-settings" class="view"></section>

      <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation"></nav>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="app.js?v=3.1.0" defer></script>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js?v=3.1.0', { updateViaCache: 'none' })
          .catch(function () {});
      });
    }());
  </script>
</body>
</html>
